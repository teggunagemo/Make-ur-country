<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Make ur country - 国家設定</title>
</head>
<body>

  <button id="logout-btn">ログアウト</button>
  <h1>国家ステータス設定</h1>
  <p id="status-msg">読み込み中...</p>

  <form id="setting-form" style="display:none;">
    <div>
      <label>国家名：<input type="text" id="input1" required></label>
    </div>
    <div>
      <label>主食：<input type="text" id="input2" required></label>
    </div>
    <div>
      <label>国技：<input type="text" id="input3" required></label>
    </div>
    <div>
      <label>首都名：<input type="text" id="input4" required></label>
    </div>

    <button type="submit" id="submit-btn">決定</button>
  </form>

  <script>
    const SUPABASE_URL = 'https://qmtokeiqblcdcfqvpdzg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_TmSpj-OvbgolXIQOck0l_A_PVke17LC';

    // ログアウト処理
    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('sb_access_token');
      window.location.href = './index.html';
    });

    // FFFFFF のようなランダムな6桁の16進数RGB文字列を生成する関数
    function generateRandomCid() {
      const num = Math.floor(Math.random() * 0x1000000);
      return num.toString(16).padStart(6, '0').toUpperCase();
    }

    async function verifyUser() {
      const token = localStorage.getItem('sb_access_token');
      if (!token) {
        window.location.href = './index.html';
        return;
      }

      const headers = {
        'Authorization': `Bearer ${token}`,
        'apikey': SUPABASE_ANON_KEY
      };

      // 1. ログインチェック
      const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, { headers });
      if (!res.ok) {
        localStorage.removeItem('sb_access_token');
        window.location.href = './index.html';
        return;
      }

      const user = await res.json();

      // 2. すでに自分の国が登録済みかチェック（登録済みなら game.html へ移動）
      const checkRes = await fetch(
        `${SUPABASE_URL}/rest/v1/countries?user_id=eq.${encodeURIComponent(user.email)}&select=id`,
        { headers }
      );
      if (checkRes.ok) {
        const existingCountries = await checkRes.json();
        if (existingCountries && existingCountries.length > 0) {
          window.location.href = './game.html';
          return;
        }
      }

      // 未建国の場合は入力フォームを表示
      document.getElementById('status-msg').style.display = 'none';
      document.getElementById('setting-form').style.display = 'block';

      // 3. 決定ボタンが押された時の処理
      document.getElementById('setting-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const submitBtn = document.getElementById('submit-btn');
        submitBtn.disabled = true;

        const data = {
          user_id: user.email,
          country_name: document.getElementById('input1').value,
          shushoku: document.getElementById('input2').value,
          kokugi: document.getElementById('input3').value,
          shuto: document.getElementById('input4').value,
          Cid: generateRandomCid() // データベース側が小文字cidの場合は 'cid' に変更
        };

        const saveRes = await fetch(`${SUPABASE_URL}/rest/v1/countries`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`,
            'apikey': SUPABASE_ANON_KEY,
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify(data)
        });

        if (saveRes.ok) {
          window.location.href = './game.html';
        } else {
          const err = await saveRes.json();
          alert('保存エラー: ' + JSON.stringify(err));
          submitBtn.disabled = false;
        }
      });
    }

    verifyUser();
  </script>

</body>
</html>
