<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Make ur country - ゲーム画面</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    canvas {
      border: 2px solid #333;
      image-rendering: pixelated;
      width: 500px;
      height: 500px;
      cursor: crosshair;
    }
    #info-bar { margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>

  <div>
    <button id="logout-btn">ログアウト</button>
    <span id="my-country-info">1. 起動中...</span>
  </div>
  <br>

  <canvas id="map-canvas" width="100" height="100"></canvas>
  <div id="info-bar">読み込み完了までお待ちください</div>

  <script>
    const SUPABASE_URL = 'https://supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_TmSpj-OvbgolXIQOck0l_A_PVke17LC';
    const MAP_SIZE = 100;

    let worldGrid = new Uint16Array(MAP_SIZE * MAP_SIZE);
    let countryDict = {};
    let myCountry = null;

    const statusSpan = document.getElementById('my-country-info');
    const infoBar = document.getElementById('info-bar');

    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('sb_access_token');
      window.location.href = './index.html';
    });

    function cidToRgb(cidStr) {
      if (!cidStr) return new Array(200, 200, 200);
      const cleanHex = cidStr.replace('#', '').trim();
      if (cleanHex.length !== 6) return new Array(200, 200, 200);
      const num = parseInt(cleanHex, 16);
      return new Array((num >> 16) & 255, (num >> 8) & 255, num & 255);
    }

    function gridToBase64(grid) {
      const bytes = new Uint8Array(grid.buffer);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }

    async function initGame() {
      try {
        const token = localStorage.getItem('sb_access_token');
        if (!token) {
          window.location.href = './index.html';
          return;
        }

        const headers = {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${token}`
        };

        // 1. ユーザー認証
        statusSpan.textContent = '1. ログイン情報を確認中...';
        const userRes = await fetch(`${SUPABASE_URL}/auth/v1/user`, { headers });
        if (!userRes.ok) {
          localStorage.removeItem('sb_access_token');
          window.location.href = './index.html';
          return;
        }
        const user = await userRes.json();

        // 2. countries テーブル取得
        statusSpan.textContent = '2. 国家データを取得中...';
        const countriesRes = await fetch(`${SUPABASE_URL}/rest/v1/countries?select=*`, { headers });
        if (!countriesRes.ok) {
          throw new Error('countries取得エラー: ' + await countriesRes.text());
        }

        const countries = await countriesRes.json();
        countryDict = {
          0: { name: '未占領地', rgb: new Array(144, 238, 144) }
        };

        for (const c of countries) {
          const rawCid = c.Cid || c.cid || '888888';
          countryDict[c.id] = {
            name: c.country_name || `国ID:${c.id}`,
            rgb: cidToRgb(rawCid),
            hex: rawCid
          };

          if (c.user_id === user.email) {
            myCountry = c;
          }
        }

        if (!myCountry) {
          statusSpan.style.color = 'red';
          statusSpan.textContent = `エラー: ${user.email} の国データが countries テーブルから見つかりません（RLSのSELECT許可を確認してください）`;
          return;
        }

        const myCid = myCountry.Cid || myCountry.cid || '888888';
        statusSpan.innerHTML =
          `あなたの国：<b>${myCountry.country_name}</b> (ID: ${myCountry.id} / 色: <span style="background:#${myCid}; padding:0 8px; border:1px solid #000;">#${myCid}</span>)`;

        // 3. world_map 取得
        infoBar.textContent = '3. マップデータをダウンロード中...';
        const mapRes = await fetch(`${SUPABASE_URL}/rest/v1/world_map?id=eq.1&select=map_data`, { headers });
        if (!mapRes.ok) {
          throw new Error('world_map取得エラー: ' + await mapRes.text());
        }

        const rows = await mapRes.json();
        if (!rows || rows.length === 0) {
          throw new Error('world_map に id=1 のデータがありません');
        }

        const cleanBase64 = rows[0].map_data.replace(/\s/g, '');
        const binaryStr = atob(cleanBase64);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) {
          bytes[i] = binaryStr.charCodeAt(i);
        }
        const loadedGrid = new Uint16Array(bytes.buffer);

        // もしDBがまだ500x500(250,000マス)のままでも止まらないように100x100(10,000マス)に調整
        if (loadedGrid.length >= MAP_SIZE * MAP_SIZE) {
          worldGrid = loadedGrid.slice(0, MAP_SIZE * MAP_SIZE);
        } else {
          throw new Error(`マップサイズが不足しています（現在: ${loadedGrid.length}マス / 必要: 10000マス）`);
        }

        // 4. 初期領土チェック
        infoBar.textContent = '4. 初期領土を確認中...';
        let hasTerritory = false;
        const totalTiles = MAP_SIZE * MAP_SIZE;
        for (let i = 0; i < totalTiles; i++) {
          if ((worldGrid[i] >> 10) === myCountry.id) {
            hasTerritory = true;
            break;
          }
        }

        if (!hasTerritory) {
          await assignRandomInitialTile(headers);
        } else {
          infoBar.textContent = 'マップ読み込み完了！マスをクリックすると座標が表示されます。';
        }

        // 5. 描画
        renderMap();

      } catch (err) {
        statusSpan.style.color = 'red';
        statusSpan.textContent = '停止エラー: ' + err.message;
        console.error(err);
      }
    }

    async function assignRandomInitialTile(headers) {
      const emptyIndices = new Array();
      const totalTiles = MAP_SIZE * MAP_SIZE;

      for (let i = 0; i < totalTiles; i++) {
        if ((worldGrid[i] >> 10) === 0) {
          emptyIndices.push(i);
        }
      }

      if (emptyIndices.length === 0) {
        alert('空き地がありません！');
        return;
      }

      const randomIdx = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
      const x = randomIdx % MAP_SIZE;
      const y = Math.floor(randomIdx / MAP_SIZE);

      worldGrid[randomIdx] = (myCountry.id << 10) | 0;

      const newBase64 = gridToBase64(worldGrid);
      const updateRes = await fetch(`${SUPABASE_URL}/rest/v1/world_map?id=eq.1`, {
        method: 'PATCH',
        headers: {
          ...headers,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({
          map_data: newBase64,
          updated_at: new Date().toISOString()
        })
      });

      if (updateRes.ok) {
        infoBar.textContent = `建国おめでとうございます！初期領土が (${x}, ${y}) に配置されました。`;
      } else {
        throw new Error('初期領土の保存エラー（RLSのUPDATE許可を確認してください）: ' + await updateRes.text());
      }
    }

    function renderMap() {
      const canvas = document.getElementById('map-canvas');
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(MAP_SIZE, MAP_SIZE);
      const pixels = imgData.data;

      const unitColor = new Array(255, 255, 255);
      const unknownColor = new Array(180, 180, 180);

      const totalTiles = MAP_SIZE * MAP_SIZE;
      for (let i = 0; i < totalTiles; i++) {
        const val = worldGrid[i];
        const countryId = val >> 10;
        const unitId = val & 0x03FF;

        let color;
        if (unitId > 0) {
          color = unitColor;
        } else if (countryDict[countryId]) {
          color = countryDict[countryId].rgb;
        } else {
          color = unknownColor;
        }

        const pIndex = i * 4;
        pixels[pIndex]     = color[0];
        pixels[pIndex + 1] = color[1];
        pixels[pIndex + 2] = color[2];
        pixels[pIndex + 3] = 255;
      }

      ctx.putImageData(imgData, 0, 0);
    }

    document.getElementById('map-canvas').addEventListener('click', (e) => {
      const canvas = e.target;
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor(((e.clientX - rect.left) / rect.width) * MAP_SIZE);
      const y = Math.floor(((e.clientY - rect.top) / rect.height) * MAP_SIZE);

      if (x >= 0 && x < MAP_SIZE && y >= 0 && y < MAP_SIZE) {
        const val = worldGrid[y * MAP_SIZE + x];
        const countryId = val >> 10;
        const unitId = val & 0x03FF;
        const ownerName = countryDict[countryId] ? countryDict[countryId].name : `不明(ID:${countryId})`;

        infoBar.textContent =
          `選択座標: (${x}, ${y}) | 領有国: ${ownerName} | ユニットID: ${unitId === 0 ? 'なし' : unitId}`;
      }
    });

    initGame();
  </script>

</body>
</html>
