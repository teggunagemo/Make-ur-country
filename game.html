<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Make ur country - マップ表示</title>
  <style>
    canvas {
      border: 1px solid #333;
      image-rendering: pixelated; 
      width: 500px;
      height: 500px;
    }
  </style>
</head>
<body>

  <canvas id="map-canvas" width="500" height="500"></canvas>

  <script>
    const SUPABASE_URL = 'https://qmtokeiqblcdcfqvpdzg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_TmSpj-OvbgolXIQOck0l_A_PVke17LC';
    const MAP_SIZE = 500;

    // 国IDごとの色設定（new Arrayで記述）
    const COUNTRY_COLORS = {
      0: new Array(144, 238, 144), // 0: 未占領（薄い緑）
      1: new Array(255, 80, 80),   // 1: 国ID 1（赤）
      2: new Array(80, 120, 255),  // 2: 国ID 2（青）
      10: new Array(255, 220, 50)  // 10: 国ID 10（黄色）
    };

    async function drawWorldMap() {
      const token = localStorage.getItem('sb_access_token');

      const res = await fetch(`${SUPABASE_URL}/rest/v1/world_map?id=eq.1&select=map_data`, {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${token || SUPABASE_ANON_KEY}`
        }
      });

      if (!res.ok) {
        alert('取得エラー: ' + await res.text());
        return;
      }

      const rows = await res.json();
      if (!rows || rows.length === 0) {
        alert('データが空です。RLSの読み取り許可を設定してください。');
        return;
      }

      const base64Str = rows.at(0).map_data;

      // Base64文字列を 250,000個の数値配列（Uint16Array）に復元
      const binaryStr = atob(base64Str);
      const bytes = new Uint8Array(binaryStr.length);
      for (let i = 0; i < binaryStr.length; i++) {
        bytes[i] = binaryStr.charCodeAt(i);
      }
      const worldGrid = new Uint16Array(bytes.buffer);

      // Canvasに25万マスを一括描画
      const canvas = document.getElementById('map-canvas');
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(MAP_SIZE, MAP_SIZE);
      const pixels = imgData.data;

      const unitColor = new Array(255, 255, 255);
      const defaultColor = new Array(200, 200, 200);

      for (let i = 0; i < worldGrid.length; i++) {
        const val = worldGrid[i];
        const countryId = val >> 10;
        const unitId = val & 0x03FF;

        let color;
        if (unitId > 0) {
          color = unitColor;
        } else {
          color = COUNTRY_COLORS[countryId] || defaultColor;
        }

        const pIndex = i * 4;
        pixels[pIndex]     = color.at(0);
        pixels[pIndex + 1] = color.at(1);
        pixels[pIndex + 2] = color.at(2);
        pixels[pIndex + 3] = 255;
      }

      ctx.putImageData(imgData, 0, 0);
    }

    drawWorldMap();
  </script>

</body>
</html>
