<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Make ur country - ゲーム画面</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      background: #fafafa;
      color: #222;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    button {
      padding: 6px 12px;
      cursor: pointer;
    }
    #map-canvas {
      border: 2px solid #333;
      image-rendering: pixelated;
      width: 800px;
      height: 500px;
      background: #222;
      cursor: grab;
      touch-action: none;
      display: block;
    }
    #map-canvas.dragging {
      cursor: grabbing;
    }
    #info-bar {
      margin-top: 10px;
      font-weight: bold;
    }
    .error-text {
      color: #c62828;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <button id="logout-btn" type="button">ログアウト</button>
    <span id="my-country-info">1. 起動中...</span>
  </div>

  <div class="toolbar">
    <button id="zoom-in-btn" type="button">ズーム +</button>
    <button id="zoom-out-btn" type="button">ズーム -</button>
    <button id="zoom-reset-btn" type="button">全体表示 (1x)</button>
    <span id="zoom-label">倍率: 1.0x | 視界: (0.0, 0.0)</span>
  </div>

  <!-- 左 100x100: マップ領域 / 右 60x100: 拡張UI領域（CSS 800x500 -> 1内部単位 = 5px） -->
  <canvas id="map-canvas" width="160" height="100"></canvas>
  <div id="info-bar">読み込み完了までお待ちください</div>

  <script>
    const SUPABASE_URL = 'https://qmtokeiqblcdcfqvpdzg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_TmSpj-OvbgolXIQOck0l_A_PVke17LC';

    const MAP_SIZE = 100;
    const TOTAL_TILES = MAP_SIZE * MAP_SIZE;
    const MAP_DRAW_WIDTH = 100;
    const MAP_DRAW_HEIGHT = 100;
    const EXT_WIDTH = 60;
    const CANVAS_WIDTH = MAP_DRAW_WIDTH + EXT_WIDTH;
    const CANVAS_HEIGHT = MAP_DRAW_HEIGHT;
    const CAPITAL_HEX = '#FFD700';

    const MIN_ZOOM = 1;
    const MAX_ZOOM = 8;
    const ZOOM_STEP = 1.25;
    const DRAG_THRESHOLD_PX = 5;

    const statusSpan = document.getElementById('my-country-info');
    const infoBar = document.getElementById('info-bar');
    const zoomLabel = document.getElementById('zoom-label');
    const canvas = document.getElementById('map-canvas');
    const ctx = canvas.getContext('2d');

    const fullMapCanvas = document.createElement('canvas');
    fullMapCanvas.width = MAP_SIZE;
    fullMapCanvas.height = MAP_SIZE;
    const fullMapCtx = fullMapCanvas.getContext('2d');

    let worldTiles = Array.from({ length: TOTAL_TILES }, (_, idx) => ({
      x: idx % MAP_SIZE,
      y: Math.floor(idx / MAP_SIZE),
      userid: 0,
      unitid: 0
    }));
    let allCountries = [];
    let countryDict = {};
    let myCountry = null;
  let substatus = 0;
    let selectedX = 50;
    let selectedY = 50;

    let zoom = 1;
    let viewX = 0;
    let viewY = 0;

    let isPointerDown = false;
    let isDragging = false;
    let dragStartClientX = 0;
    let dragStartClientY = 0;
    let dragStartViewX = 0;
    let dragStartViewY = 0;

    function showFatalError(message) {
      console.error('[Make ur country]', message);
      statusSpan.className = 'error-text';
      statusSpan.textContent = 'エラー: ' + message;
      infoBar.textContent = '処理を停止しました。';
    }

    window.addEventListener('error', (event) => {
      showFatalError(event.message || '予期しないスクリプトエラー');
    });

    window.addEventListener('unhandledrejection', (event) => {
      const reason = event.reason && event.reason.message ? event.reason.message : String(event.reason);
      showFatalError(reason || '非同期処理エラー');
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('sb_access_token');
      window.location.href = './index.html';
    });

    // --- 変換・判定ユーティリティ ---
    function getTileIndex(x, y) {
      return y * MAP_SIZE + x;
    }

    function getTile(x, y) {
      if (x < 0 || x >= MAP_SIZE || y < 0 || y >= MAP_SIZE) return null;
      return worldTiles[getTileIndex(x, y)];
    }

    function cidToRgb(cidStr) {
      if (!cidStr) return [200, 200, 200];
      const hex = String(cidStr).replace('#', '').trim();
      if (hex.length !== 6) return [200, 200, 200];
      const num = parseInt(hex, 16);
      if (Number.isNaN(num)) return [200, 200, 200];
      return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
    }

    function hasValidCapital(country) {
      return (
        country &&
        typeof country.capital_x === 'number' &&
        typeof country.capital_y === 'number' &&
        country.capital_x >= 0 &&
        country.capital_x < MAP_SIZE &&
        country.capital_y >= 0 &&
        country.capital_y < MAP_SIZE
      );
    }

    // --- Supabase REST API（world_tiles / countries） ---
    async function getCurrentUser(headers) {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, { headers });
      if (!res.ok) return null;
      return res.json();
    }

    async function loadCountries(headers) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/countries?select=*`, { headers });
      if (!res.ok) {
        throw new Error('countries 取得失敗: ' + (await res.text()));
      }
      return res.json();
    }

    async function fetchAllTiles(headers) {
      const tiles = Array.from({ length: TOTAL_TILES }, (_, idx) => ({
        x: idx % MAP_SIZE,
        y: Math.floor(idx / MAP_SIZE),
        userid: 0,
        unitid: 0
      }));

      const pageSize = 1000;
      for (let start = 0; start < TOTAL_TILES; start += pageSize) {
        const end = Math.min(TOTAL_TILES - 1, start + pageSize - 1);
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/world_tiles?select=x,y,userid,unitid&order=y.asc,x.asc`,
          {
            headers: {
              ...headers,
              'Range': `${start}-${end}`
            }
          }
        );

        if (!res.ok) {
          throw new Error('world_tiles 取得失敗: ' + (await res.text()));
        }

        const rows = await res.json();
        for (const row of rows) {
          if (
            typeof row.x === 'number' &&
            typeof row.y === 'number' &&
            row.x >= 0 && row.x < MAP_SIZE &&
            row.y >= 0 && row.y < MAP_SIZE
          ) {
            const idx = getTileIndex(row.x, row.y);
            tiles[idx] = {
              x: row.x,
              y: row.y,
              userid: Number(row.userid ?? 0),
              unitid: Number(row.unitid ?? 0)
            };
          }
        }
      }

      return tiles;
    }

    async function upsertTiles(headers, updatedTiles) {
      if (!updatedTiles || updatedTiles.length === 0) return;

      const payload = updatedTiles.map((t) => ({
        x: t.x,
        y: t.y,
        userid: t.userid,
        unitid: t.unitid,
        updated_at: new Date().toISOString()
      }));

      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/world_tiles?on_conflict=x,y`,
        {
          method: 'POST',
          headers: {
            ...headers,
            'Content-Type': 'application/json',
            'Prefer': 'resolution=merge-duplicates,return=minimal'
          },
          body: JSON.stringify(payload)
        }
      );

      if (!res.ok) {
        throw new Error('world_tiles 保存失敗: ' + (await res.text()));
      }
    }

    async function saveCapital(headers, countryId, x, y, isDefeated = false) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/countries?id=eq.${countryId}`, {
        method: 'PATCH',
        headers: {
          ...headers,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify({
          capital_x: x,
          capital_y: y,
          is_defeated: isDefeated
        })
      });

      if (!res.ok) {
        throw new Error('首都座標の保存失敗: ' + (await res.text()));
      }

      const updatedRows = await res.json();
      const updated = updatedRows[0] || { capital_x: x, capital_y: y, is_defeated: isDefeated };
      allCountries = allCountries.map((c) => (c.id === countryId ? { ...c, ...updated } : c));
      if (myCountry && myCountry.id === countryId) {
        myCountry = { ...myCountry, ...updated };
      }
    }

    // --- 初期領土（3x3） ---
    function collect3x3EmptyTiles(centerX, centerY) {
      const targets = [];
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const tile = getTile(centerX + dx, centerY + dy);
          if (tile && tile.userid === 0) {
            targets.push(tile);
          }
        }
      }
      return targets;
    }

    async function setupInitialTerritory(headers) {
      const firstOwnedTile = worldTiles.find((t) => t.userid === myCountry.id);

      if (!firstOwnedTile) {
        const emptyTiles = worldTiles.filter((t) => t.userid === 0);
        if (emptyTiles.length === 0) {
          infoBar.textContent = '空き地がありません。';
          return;
        }

        const centerTile = emptyTiles[Math.floor(Math.random() * emptyTiles.length)];
        const targets = collect3x3EmptyTiles(centerTile.x, centerTile.y);

        for (const tile of targets) {
          tile.userid = myCountry.id;
        }

        await upsertTiles(headers, targets);
        await saveCapital(headers, myCountry.id, centerTile.x, centerTile.y, false);

        selectedX = centerTile.x;
        selectedY = centerTile.y;
        infoBar.textContent =
          `建国完了！首都 (${centerTile.x}, ${centerTile.y}) を中心に ${targets.length} マス（3×3）を確保しました。`;
        return;
      }

      if (!hasValidCapital(myCountry)) {
        await saveCapital(headers, myCountry.id, firstOwnedTile.x, firstOwnedTile.y, false);
      }

      if (hasValidCapital(myCountry)) {
        selectedX = myCountry.capital_x;
        selectedY = myCountry.capital_y;
      }

      infoBar.textContent =
        `読み込み完了！首都: (${myCountry.capital_x}, ${myCountry.capital_y}) | ドラッグで移動・ホイールでズーム`;
    }

    // --- 座標変換・カメラ・描画 ---
    function clientToCanvasCoord(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return {
        cx: ((clientX - rect.left) / rect.width) * CANVAS_WIDTH,
        cy: ((clientY - rect.top) / rect.height) * CANVAS_HEIGHT
      };
    }

    function clientToMapCoord(clientX, clientY) {
      const { cx, cy } = clientToCanvasCoord(clientX, clientY);
      const visibleSize = MAP_SIZE / zoom;
      return {
        mapX: viewX + (cx / MAP_DRAW_WIDTH) * visibleSize,
        mapY: viewY + (cy / MAP_DRAW_HEIGHT) * visibleSize
      };
    }

    function clampCamera() {
      const visibleSize = MAP_SIZE / zoom;
      const maxOffset = Math.max(0, MAP_SIZE - visibleSize);
      viewX = Math.min(maxOffset, Math.max(0, viewX));
      viewY = Math.min(maxOffset, Math.max(0, viewY));
    }

    function updateZoomLabel() {
      zoomLabel.textContent =
        `倍率: ${zoom.toFixed(1)}x | 視界: (${viewX.toFixed(1)}, ${viewY.toFixed(1)})`;
    }

    function setZoomAt(nextZoom, focusX = MAP_SIZE / 2, focusY = MAP_SIZE / 2) {
      const clamped = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, nextZoom));
      if (clamped === zoom) return;

      const prevVisible = MAP_SIZE / zoom;
      const nextVisible = MAP_SIZE / clamped;
      const relX = (focusX - viewX) / prevVisible;
      const relY = (focusY - viewY) / prevVisible;

      zoom = clamped;
      viewX = focusX - relX * nextVisible;
      viewY = focusY - relY * nextVisible;
      clampCamera();
      renderMap();
    }

    function rebuildFullMapBuffer() {
      const imgData = fullMapCtx.createImageData(MAP_SIZE, MAP_SIZE);
      const pixels = imgData.data;
      const unitColor = [255, 255, 255];
      const unknownColor = [180, 180, 180];

      for (let i = 0; i < TOTAL_TILES; i++) {
        const tile = worldTiles[i];
        const ownerId = tile ? tile.userid : 0;
        const unitId = tile ? tile.unitid : 0;
        const rgb = unitId > 0
          ? unitColor
          : (countryDict[ownerId] ? countryDict[ownerId].rgb : unknownColor);

        const p = i * 4;
        pixels[p] = rgb[0];
        pixels[p + 1] = rgb[1];
        pixels[p + 2] = rgb[2];
        pixels[p + 3] = 255;
      }
      fullMapCtx.putImageData(imgData, 0, 0);
    }

    // 右側拡張領域（x: 100..160, y: 0..100）の描画フック
    function renderRightExtension(visibleSize) {
      ctx.save();
      ctx.fillStyle = '#1e242b';
      ctx.fillRect(MAP_DRAW_WIDTH, 0, EXT_WIDTH, CANVAS_HEIGHT);

      ctx.strokeStyle = '#555';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(MAP_DRAW_WIDTH + 0.5, 0);
      ctx.lineTo(MAP_DRAW_WIDTH + 0.5, CANVAS_HEIGHT);
    
      ctx.stroke();
      const tile = getTile(selectedX, selectedY);
      switch(substatus){
        case 1:{
          if (tile && tile.unitid > 0) {
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(122, 8, 12, 12);
    }
        }
      }
      ctx.restore();
    }

    function renderMap() {
      clampCamera();
      const visibleSize = MAP_SIZE / zoom;

      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      ctx.drawImage(
        fullMapCanvas,
        viewX, viewY, visibleSize, visibleSize,
        0, 0, MAP_DRAW_WIDTH, MAP_DRAW_HEIGHT
      );

      const dotSize = Math.max(0.35, 1 / Math.sqrt(zoom));
      ctx.fillStyle = CAPITAL_HEX;
      for (const c of allCountries) {
        if (c.is_defeated || !hasValidCapital(c)) continue;
        const cx = c.capital_x + 0.5;
        const cy = c.capital_y + 0.5;
        const sx = ((cx - viewX) / visibleSize) * MAP_DRAW_WIDTH;
        const sy = ((cy - viewY) / visibleSize) * MAP_DRAW_HEIGHT;
        ctx.fillRect(sx - dotSize / 2, sy - dotSize / 2, dotSize, dotSize);
      }

      if (
        typeof selectedX === 'number' &&
        typeof selectedY === 'number' &&
        selectedX >= 0 &&
        selectedX < MAP_SIZE &&
        selectedY >= 0 &&
        selectedY < MAP_SIZE
      ) {
        const cellSize = MAP_DRAW_WIDTH / visibleSize;
        const selX = ((selectedX - viewX) / visibleSize) * MAP_DRAW_WIDTH;
        const selY = ((selectedY - viewY) / visibleSize) * MAP_DRAW_HEIGHT;

        ctx.save();
        ctx.strokeStyle = '#ff1744';
        ctx.lineWidth = Math.max(0.25, Math.min(0.8, 0.45 / Math.sqrt(zoom)));
        ctx.strokeRect(selX, selY, cellSize, cellSize);
        ctx.restore();
      }

      renderRightExtension(visibleSize);
      updateZoomLabel();
    }

    function handleExtensionClick(cx, cy) {
      // 拡張領域（cx >= MAP_DRAW_WIDTH）のクリック処理はここに実装
      if (cx >= 100 && cx <= 120 && cy >= 0 && cy <= 20) {
        ctx.fillStyle = 'orange';
ctx.fillRect(100, 0, 20, 20);
        substatus = 1;
    infoBar.textContent = 'hello world';
    return;
  }

      infoBar.textContent = `拡張パネルクリック: (${cx.toFixed(1)}, ${cy.toFixed(1)})`;
    }

    function handleCanvasClick(clientX, clientY) {
      const { cx, cy } = clientToCanvasCoord(clientX, clientY);
      if (cx >= MAP_DRAW_WIDTH) {
        handleExtensionClick(cx, cy);
        return;
      }

      const { mapX, mapY } = clientToMapCoord(clientX, clientY);
      const x = Math.floor(mapX);
      const y = Math.floor(mapY);
      const tile = getTile(x, y);
      if (!tile) return;

      selectedX = x;
      selectedY = y;

      const ownerName = countryDict[tile.userid]
        ? countryDict[tile.userid].name
        : `不明(ID:${tile.userid})`;
      const capCountry = allCountries.find(
        (c) => !c.is_defeated && c.capital_x === x && c.capital_y === y
      );
      const capText = capCountry ? ` | ★首都: ${capCountry.country_name || `国ID:${capCountry.id}`}` : '';

      infoBar.textContent =
        `座標 (${x}, ${y}) | 領有: ${ownerName} | ユニット: ${tile.unitid === 0 ? 'なし' : tile.unitid}${capText}`;

      renderMap();
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      const { cx } = clientToCanvasCoord(e.clientX, e.clientY);
      if (cx >= MAP_DRAW_WIDTH) return;

      isPointerDown = true;
      isDragging = false;
      dragStartClientX = e.clientX;
      dragStartClientY = e.clientY;
      dragStartViewX = viewX;
      dragStartViewY = viewY;
      canvas.setPointerCapture(e.pointerId);
      canvas.classList.add('dragging');
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;
      const dx = e.clientX - dragStartClientX;
      const dy = e.clientY - dragStartClientY;
      if (!isDragging && Math.hypot(dx, dy) >= DRAG_THRESHOLD_PX) {
        isDragging = true;
      }
      if (isDragging) {
        const rect = canvas.getBoundingClientRect();
        const mapDisplayWidth = rect.width * (MAP_DRAW_WIDTH / CANVAS_WIDTH);
        const mapDisplayHeight = rect.height * (MAP_DRAW_HEIGHT / CANVAS_HEIGHT);
        const visibleSize = MAP_SIZE / zoom;
        viewX = dragStartViewX - (dx / mapDisplayWidth) * visibleSize;
        viewY = dragStartViewY - (dy / mapDisplayHeight) * visibleSize;
        renderMap();
      }
    });

    canvas.addEventListener('pointerup', (e) => {
      if (!isPointerDown) return;
      const wasDragging = isDragging;
      isPointerDown = false;
      isDragging = false;
      canvas.classList.remove('dragging');
      if (canvas.hasPointerCapture(e.pointerId)) {
        canvas.releasePointerCapture(e.pointerId);
      }
      if (!wasDragging) {
        handleCanvasClick(e.clientX, e.clientY);
      }
    });

    canvas.addEventListener('click', (e) => {
      if (isPointerDown || isDragging) return;
      const { cx } = clientToCanvasCoord(e.clientX, e.clientY);
      if (cx >= MAP_DRAW_WIDTH) {
        handleCanvasClick(e.clientX, e.clientY);
      }
    });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const { cx } = clientToCanvasCoord(e.clientX, e.clientY);
      if (cx >= MAP_DRAW_WIDTH) return;
      const { mapX, mapY } = clientToMapCoord(e.clientX, e.clientY);
      setZoomAt(e.deltaY < 0 ? zoom * ZOOM_STEP : zoom / ZOOM_STEP, mapX, mapY);
    }, { passive: false });

    document.getElementById('zoom-in-btn').addEventListener('click', () => {
      const visibleSize = MAP_SIZE / zoom;
      setZoomAt(zoom * ZOOM_STEP, viewX + visibleSize / 2, viewY + visibleSize / 2);
    });

    document.getElementById('zoom-out-btn').addEventListener('click', () => {
      const visibleSize = MAP_SIZE / zoom;
      setZoomAt(zoom / ZOOM_STEP, viewX + visibleSize / 2, viewY + visibleSize / 2);
    });

    document.getElementById('zoom-reset-btn').addEventListener('click', () => {
      zoom = 1;
      viewX = 0;
      viewY = 0;
      renderMap();
    });

    // --- 起動 ---
    async function startGame() {
      const token = localStorage.getItem('sb_access_token');
      if (!token) {
        window.location.href = './index.html';
        return;
      }

      const headers = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${token}`
      };

      statusSpan.textContent = '1. ログイン情報を確認中...';
      const user = await getCurrentUser(headers);
      if (!user) {
        localStorage.removeItem('sb_access_token');
        window.location.href = './index.html';
        return;
      }

      statusSpan.textContent = '2. 国家データを取得中...';
      allCountries = await loadCountries(headers);
      countryDict = { 0: { name: '未占領地', rgb: [144, 238, 144] } };
      myCountry = null;

      for (const c of allCountries) {
        const rawCid = c.Cid || c.cid || '888888';
        countryDict[c.id] = {
          name: c.country_name || `国ID:${c.id}`,
          rgb: cidToRgb(rawCid)
        };
        if (c.user_id === user.email) {
          myCountry = c;
        }
      }

      if (!myCountry) {
        showFatalError(`${user.email} の国データが countries に見つかりません`);
        return;
      }

      const myCid = myCountry.Cid || myCountry.cid || '888888';
      statusSpan.innerHTML =
        `あなたの国：<b>${myCountry.country_name}</b> (ID: ${myCountry.id} / 色: <span style="background:#${myCid}; padding:0 8px; border:1px solid #000;">#${myCid}</span>)`;

      infoBar.textContent = '3. タイルデータ（10,000行）をダウンロード中...';
      worldTiles = await fetchAllTiles(headers);

      infoBar.textContent = '4. 初期領土と首都を確認中...';
      await setupInitialTerritory(headers);

      rebuildFullMapBuffer();
      renderMap();
    }

    startGame().catch((err) => {
      showFatalError(err && err.message ? err.message : String(err));
    });
  </script>

</body>
</html>
