<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Make ur country - ゲーム画面</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    canvas {
      border: 2px solid #333;
      image-rendering: pixelated;
      width: 500px;
      height: 500px;
      cursor: grab;
      touch-action: none;
    }
    canvas.dragging { cursor: grabbing; }
    #info-bar { margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="toolbar">
    <button id="logout-btn">ログアウト</button>
    <span id="my-country-info">1. 起動中...</span>
  </div>

  <div class="toolbar">
    <button id="zoom-in-btn" type="button">ズーム +</button>
    <button id="zoom-out-btn" type="button">ズーム -</button>
    <button id="zoom-reset-btn" type="button">全体表示 (1x)</button>
    <span id="zoom-label">倍率: 1.0x | 視界: (0, 0)</span>
  </div>

  <canvas id="map-canvas" width="100" height="100"></canvas>
  <div id="info-bar">読み込み完了までお待ちください</div>

  <script>
    const SUPABASE_URL = 'https://qmtokeiqblcdcfqvpdzg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_TmSpj-OvbgolXIQOck0l_A_PVke17LC';

    const MAP_SIZE = 100;
    const TOTAL_TILES = MAP_SIZE * MAP_SIZE;
    const CAPITAL_HEX = '#FFD700';

    const MIN_ZOOM = 1;
    const MAX_ZOOM = 8;
    const ZOOM_STEP = 1.25;
    const DRAG_THRESHOLD_PX = 5;

    let worldGrid = new Uint16Array(TOTAL_TILES);
    let allCountries = [];
    let countryDict = {};
    let myCountry = null;

    // 視界状態（単位はマップ座標系 0..100）
    let zoom = 1;
    let viewX = 0; // 表示領域の左端（マップX）
    let viewY = 0; // 表示領域の上端（マップY）

    // ドラッグ状態
    let isPointerDown = false;
    let isDragging = false;
    let dragStartClientX = 0;
    let dragStartClientY = 0;
    let dragStartViewX = 0;
    let dragStartViewY = 0;

    // オフスクリーンに全マップ（地形・領土・ユニット）を保持して高速描画
    const fullMapCanvas = document.createElement('canvas');
    fullMapCanvas.width = MAP_SIZE;
    fullMapCanvas.height = MAP_SIZE;
    const fullMapCtx = fullMapCanvas.getContext('2d');

    const statusSpan = document.getElementById('my-country-info');
    const infoBar = document.getElementById('info-bar');
    const zoomLabel = document.getElementById('zoom-label');
    const canvas = document.getElementById('map-canvas');
    const ctx = canvas.getContext('2d');

    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('sb_access_token');
      window.location.href = './index.html';
    });

    // ==========================================
    // 1. ビット操作・色変換・Base64 ユーティリティ
    // ==========================================
    function getOwnerId(cellVal) {
      return cellVal >> 10;
    }

    function getUnitId(cellVal) {
      return cellVal & 0x03FF;
    }

    function packCell(ownerId, unitId = 0) {
      return ((ownerId << 10) | (unitId & 0x03FF)) >>> 0;
    }

    function cidToRgb(cidStr) {
      if (!cidStr) return [200, 200, 200];
      const cleanHex = cidStr.replace('#', '').trim();
      if (cleanHex.length !== 6) return [200, 200, 200];
      const num = parseInt(cleanHex, 16);
      return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
    }

    function gridToBase64(grid) {
      const bytes = new Uint8Array(grid.buffer);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }

    function decodeMapBase64(base64Str) {
      const cleanBase64 = (base64Str || '').replace(/\s/g, '');
      const binaryStr = atob(cleanBase64);
      const bytes = new Uint8Array(binaryStr.length);
      for (let i = 0; i < binaryStr.length; i++) {
        bytes[i] = binaryStr.charCodeAt(i);
      }
      const loadedGrid = new Uint16Array(bytes.buffer);
      if (loadedGrid.length < TOTAL_TILES) {
        throw new Error(`マップサイズが不足しています（現在: ${loadedGrid.length}マス / 必要: ${TOTAL_TILES}マス）`);
      }
      return loadedGrid.slice(0, TOTAL_TILES);
    }

    function hasValidCapital(country) {
      return (
        country &&
        typeof country.capital_x === 'number' &&
        typeof country.capital_y === 'number' &&
        country.capital_x >= 0 &&
        country.capital_x < MAP_SIZE &&
        country.capital_y >= 0 &&
        country.capital_y < MAP_SIZE
      );
    }

    // ==========================================
    // 2. ズーム・視界移動（カメラ制御）
    // ==========================================
    function clampCamera() {
      const visibleSize = MAP_SIZE / zoom;
      const maxOffset = Math.max(0, MAP_SIZE - visibleSize);
      if (viewX < 0) viewX = 0;
      if (viewY < 0) viewY = 0;
      if (viewX > maxOffset) viewX = maxOffset;
      if (viewY > maxOffset) viewY = maxOffset;
    }

    function updateZoomLabel() {
      zoomLabel.textContent =
        `倍率: ${zoom.toFixed(1)}x | 視界: (${viewX.toFixed(1)}, ${viewY.toFixed(1)})`;
    }

    function setZoomAt(newZoom, focusMapX = MAP_SIZE / 2, focusMapY = MAP_SIZE / 2) {
      const clampedZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, newZoom));
      if (clampedZoom === zoom) return;

      const prevVisible = MAP_SIZE / zoom;
      const nextVisible = MAP_SIZE / clampedZoom;

      // カーソル位置（または画面中心）のマップ座標がずれないように視界を調整
      const relX = (focusMapX - viewX) / prevVisible;
      const relY = (focusMapY - viewY) / prevVisible;

      zoom = clampedZoom;
      viewX = focusMapX - relX * nextVisible;
      viewY = focusMapY - relY * nextVisible;

      clampCamera();
      renderMap();
    }

    function resetCamera() {
      zoom = 1;
      viewX = 0;
      viewY = 0;
      renderMap();
    }

    function clientToMapCoord(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const normX = (clientX - rect.left) / rect.width;
      const normY = (clientY - rect.top) / rect.height;
      const visibleSize = MAP_SIZE / zoom;
      return {
        mapX: viewX + normX * visibleSize,
        mapY: viewY + normY * visibleSize
      };
    }

    // ==========================================
    // 3. Supabase REST API 通信ヘルパー
    // ==========================================
    async function fetchAuthUser(headers) {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, { headers });
      if (!res.ok) return null;
      return res.json();
    }

    async function fetchCountries(headers) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/countries?select=*`, { headers });
      if (!res.ok) {
        throw new Error('countries取得エラー: ' + await res.text());
      }
      return res.json();
    }

    async function fetchWorldMapGrid(headers) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/world_map?id=eq.1&select=map_data`, { headers });
      if (!res.ok) {
        throw new Error('world_map取得エラー: ' + await res.text());
      }
      const rows = await res.json();
      if (!rows || rows.length === 0) {
        throw new Error('world_map に id=1 のデータがありません');
      }
      return decodeMapBase64(rows[0].map_data);
    }

    async function patchWorldMap(headers, grid) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/world_map?id=eq.1`, {
        method: 'PATCH',
        headers: {
          ...headers,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({
          map_data: gridToBase64(grid),
          updated_at: new Date().toISOString()
        })
      });

      if (!res.ok) {
        throw new Error('マップ保存エラー（RLSのUPDATE許可を確認してください）: ' + await res.text());
      }
    }

    async function patchCountryCapital(headers, countryId, x, y, isDefeated = false) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/countries?id=eq.${countryId}`, {
        method: 'PATCH',
        headers: {
          ...headers,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify({
          capital_x: x,
          capital_y: y,
          is_defeated: isDefeated
        })
      });

      if (!res.ok) {
        throw new Error('首都座標の保存エラー（countries の RLS UPDATE ポリシーを確認してください）: ' + await res.text());
      }

      const updatedRows = await res.json();
      const updated = updatedRows[0] || { capital_x: x, capital_y: y, is_defeated: isDefeated };

      allCountries = allCountries.map((c) => (c.id === countryId ? { ...c, ...updated } : c));
      if (myCountry && myCountry.id === countryId) {
        myCountry = { ...myCountry, ...updated };
      }
    }

    // ==========================================
    // 4. 国家情報・3x3 初期領土生成ロジック
    // ==========================================
    function buildCountryDictionary(countries, userEmail) {
      const dict = {
        0: { name: '未占領地', rgb: [144, 238, 144] }
      };
      let foundMe = null;

      for (const c of countries) {
        const rawCid = c.Cid || c.cid || '888888';
        dict[c.id] = {
          name: c.country_name || `国ID:${c.id}`,
          rgb: cidToRgb(rawCid),
          hex: rawCid
        };
        if (c.user_id === userEmail) {
          foundMe = c;
        }
      }

      return { dict, myCountry: foundMe };
    }

    function findFirstOwnedTileIndex(countryId) {
      for (let i = 0; i < TOTAL_TILES; i++) {
        if (getOwnerId(worldGrid[i]) === countryId) {
          return i;
        }
      }
      return -1;
    }

    function collectInitial3x3Indices(centerX, centerY) {
      const indices = [];
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const x = centerX + dx;
          const y = centerY + dy;
          if (x < 0 || x >= MAP_SIZE || y < 0 || y >= MAP_SIZE) continue;

          const idx = y * MAP_SIZE + x;
          if (getOwnerId(worldGrid[idx]) === 0) {
            indices.push(idx);
          }
        }
      }
      return indices;
    }

    async function assignInitial3x3Territory(headers) {
      const emptyIndices = [];
      for (let i = 0; i < TOTAL_TILES; i++) {
        if (getOwnerId(worldGrid[i]) === 0) {
          emptyIndices.push(i);
        }
      }

      if (emptyIndices.length === 0) {
        alert('空き地がありません！');
        return;
      }

      const centerIdx = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
      const centerX = centerIdx % MAP_SIZE;
      const centerY = Math.floor(centerIdx / MAP_SIZE);

      const targetIndices = collectInitial3x3Indices(centerX, centerY);
      for (const idx of targetIndices) {
        const currentUnit = getUnitId(worldGrid[idx]);
        worldGrid[idx] = packCell(myCountry.id, currentUnit);
      }

      await patchWorldMap(headers, worldGrid);
      await patchCountryCapital(headers, myCountry.id, centerX, centerY, false);

      infoBar.textContent =
        `建国おめでとうございます！首都 (${centerX}, ${centerY}) を中心に ${targetIndices.length} マス（3×3）の初期領土を獲得しました。`;
    }

    async function ensureInitialTerritory(headers) {
      const firstIdx = findFirstOwnedTileIndex(myCountry.id);

      if (firstIdx === -1) {
        await assignInitial3x3Territory(headers);
        return;
      }

      if (!hasValidCapital(myCountry)) {
        const capX = firstIdx % MAP_SIZE;
        const capY = Math.floor(firstIdx / MAP_SIZE);
        await patchCountryCapital(headers, myCountry.id, capX, capY, false);
      }

      infoBar.textContent =
        `マップ読み込み完了！首都: (${myCountry.capital_x}, ${myCountry.capital_y}) | ドラッグで移動・ホイールでズーム・クリックで座標表示。`;
    }

    // ==========================================
    // 5. Canvas 描画・入力イベント
    // ==========================================
    function rebuildFullMapBuffer() {
      const imgData = fullMapCtx.createImageData(MAP_SIZE, MAP_SIZE);
      const pixels = imgData.data;
      const unitColor = [255, 255, 255];
      const unknownColor = [180, 180, 180];

      for (let i = 0; i < TOTAL_TILES; i++) {
        const val = worldGrid[i];
        const countryId = getOwnerId(val);
        const unitId = getUnitId(val);

        let color;
        if (unitId > 0) {
          color = unitColor;
        } else if (countryDict[countryId]) {
          color = countryDict[countryId].rgb;
        } else {
          color = unknownColor;
        }

        const pIndex = i * 4;
        pixels[pIndex]     = color[0];
        pixels[pIndex + 1] = color[1];
        pixels[pIndex + 2] = color[2];
        pixels[pIndex + 3] = 255;
      }

      fullMapCtx.putImageData(imgData, 0, 0);
    }

    function renderVisibleMap() {
      clampCamera();
      const visibleSize = MAP_SIZE / zoom;

      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0, 0, MAP_SIZE, MAP_SIZE);
      ctx.drawImage(
        fullMapCanvas,
        viewX, viewY, visibleSize, visibleSize,
        0, 0, MAP_SIZE, MAP_SIZE
      );
    }

    function renderCapitals() {
      const visibleSize = MAP_SIZE / zoom;
      const dotSize = Math.max(0.35, 1 / Math.sqrt(zoom));

      ctx.fillStyle = CAPITAL_HEX;
      for (const c of allCountries) {
        if (c.is_defeated || !hasValidCapital(c)) continue;

        const cx = c.capital_x + 0.5;
        const cy = c.capital_y + 0.5;
        if (
          cx < viewX - 1 || cx > viewX + visibleSize + 1 ||
          cy < viewY - 1 || cy > viewY + visibleSize + 1
        ) {
          continue;
        }

        const screenX = ((cx - viewX) / visibleSize) * MAP_SIZE;
        const screenY = ((cy - viewY) / visibleSize) * MAP_SIZE;
        ctx.fillRect(screenX - dotSize / 2, screenY - dotSize / 2, dotSize, dotSize);
      }
    }

    function renderMap() {
      renderVisibleMap();
      renderCapitals();
      updateZoomLabel();
    }

    function handleCanvasClick(clientX, clientY) {
      const { mapX, mapY } = clientToMapCoord(clientX, clientY);
      const x = Math.floor(mapX);
      const y = Math.floor(mapY);

      if (x < 0 || x >= MAP_SIZE || y < 0 || y >= MAP_SIZE) return;

      const val = worldGrid[y * MAP_SIZE + x];
      const countryId = getOwnerId(val);
      const unitId = getUnitId(val);
      const ownerName = countryDict[countryId] ? countryDict[countryId].name : `不明(ID:${countryId})`;

      const capitalCountry = allCountries.find(
        (c) => !c.is_defeated && c.capital_x === x && c.capital_y === y
      );
      const capitalLabel = capitalCountry
        ? ` | ★首都: ${capitalCountry.country_name || `国ID:${capitalCountry.id}`}`
        : '';

      infoBar.textContent =
        `選択座標: (${x}, ${y}) | 領有国: ${ownerName} | ユニットID: ${unitId === 0 ? 'なし' : unitId}${capitalLabel}`;
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      isPointerDown = true;
      isDragging = false;
      dragStartClientX = e.clientX;
      dragStartClientY = e.clientY;
      dragStartViewX = viewX;
      dragStartViewY = viewY;
      canvas.setPointerCapture(e.pointerId);
      canvas.classList.add('dragging');
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;

      const dxPx = e.clientX - dragStartClientX;
      const dyPx = e.clientY - dragStartClientY;

      if (!isDragging && Math.hypot(dxPx, dyPx) >= DRAG_THRESHOLD_PX) {
        isDragging = true;
      }

      if (isDragging) {
        const rect = canvas.getBoundingClientRect();
        const visibleSize = MAP_SIZE / zoom;
        const mapDeltaX = (dxPx / rect.width) * visibleSize;
        const mapDeltaY = (dyPx / rect.height) * visibleSize;

        viewX = dragStartViewX - mapDeltaX;
        viewY = dragStartViewY - mapDeltaY;
        renderMap();
      }
    });
