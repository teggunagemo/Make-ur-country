<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Make ur country - ゲーム画面</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      background: #fafafa;
      color: #222;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    button {
      padding: 6px 12px;
      cursor: pointer;
    }
    #map-canvas {
      border: 2px solid #333;
      image-rendering: pixelated;
      width: 800px;
      height: 500px;
      background: #222;
      cursor: grab;
      touch-action: none;
      display: block;
    }
    #map-canvas.dragging {
      cursor: grabbing;
    }
    #info-bar {
      margin-top: 10px;
      font-weight: bold;
    }
    .error-text {
      color: #c62828;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <button id="logout-btn" type="button">ログアウト</button>
    <span id="my-country-info">1. 起動中...</span>
  </div>

  <div class="toolbar">
    <button id="zoom-in-btn" type="button">ズーム +</button>
    <button id="zoom-out-btn" type="button">ズーム -</button>
    <button id="zoom-reset-btn" type="button">全体表示 (1x)</button>
    <span id="zoom-label">倍率: 1.0x | 視界: (0.0, 0.0)</span>
  </div>

  <!-- 左 100x100: マップ領域 / 右 60x100: 拡張UI領域（CSS 800x500 -> 1内部単位 = 5px） -->
  <canvas id="map-canvas" width="160" height="100"></canvas>
  <div id="info-bar">読み込み完了までお待ちください</div>

  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/renderer.js"></script>
  <script src="./js/input.js"></script>
  <script src="./js/main.js"></script>

</body>
</html>
