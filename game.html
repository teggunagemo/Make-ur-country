<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Make ur country - マップ表示</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      background: #fafafa;
      color: #222;
    }
    #top-bar {
      margin-bottom: 10px;
    }
    #map-canvas {
      border: 2px solid #333;
      width: 500px;
      height: 500px;
      image-rendering: pixelated;
      background: #222;
      cursor: pointer;
      display: block;
    }
    #info-bar {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="top-bar">
    <button id="logout-btn" type="button">ログアウト</button>
    <span id="my-country-info">読み込み中...</span>
  </div>

  <!-- 100x100 マスを 500x500px で表示 -->
  <canvas id="map-canvas" width="100" height="100"></canvas>
  <div id="info-bar">待機中...</div>

  <script>
    const SUPABASE_URL = 'https://qmtokeiqblcdcfqvpdzg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_TmSpj-OvbgolXIQOck0l_A_PVke17LC';

    const MAP_SIZE = 100;
    const TOTAL_TILES = MAP_SIZE * MAP_SIZE;

    const statusSpan = document.getElementById('my-country-info');
    const infoBar = document.getElementById('info-bar');
    const canvas = document.getElementById('map-canvas');
    const ctx = canvas.getContext('2d');

    let worldTiles = Array.from({ length: TOTAL_TILES }, (_, i) => ({
      x: i % MAP_SIZE,
      y: Math.floor(i / MAP_SIZE),
      userid: 0,
      unitid: 0
    }));
    let countryDict = {};
    let selectedX = 0;
    let selectedY = 0;

    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('sb_access_token');
      window.location.href = './index.html';
    });

    function cidToHex(cidStr) {
      if (!cidStr) return '#c8c8c8';
      const hex = String(cidStr).replace('#', '').trim();
      return hex.length === 6 ? '#' + hex : '#c8c8c8';
    }

    async function getCurrentUser(headers) {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, { headers });
      if (!res.ok) return null;
      return res.json();
    }

    async function loadCountries(headers) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/countries?select=*`, { headers });
      if (!res.ok) throw new Error('countries 取得失敗');
      return res.json();
    }

    async function fetchAllTiles(headers) {
      const tiles = Array.from({ length: TOTAL_TILES }, (_, i) => ({
        x: i % MAP_SIZE,
        y: Math.floor(i / MAP_SIZE),
        userid: 0,
        unitid: 0
      }));

      const pageSize = 1000;
      for (let start = 0; start < TOTAL_TILES; start += pageSize) {
        const end = Math.min(TOTAL_TILES - 1, start + pageSize - 1);
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/world_tiles?select=x,y,userid,unitid&order=y.asc,x.asc`,
          { headers: { ...headers, 'Range': `${start}-${end}` } }
        );
        if (!res.ok) throw new Error('world_tiles 取得失敗');

        const rows = await res.json();
        for (const row of rows) {
          if (row.x >= 0 && row.x < MAP_SIZE && row.y >= 0 && row.y < MAP_SIZE) {
            tiles[row.y * MAP_SIZE + row.x] = {
              x: row.x,
              y: row.y,
              userid: Number(row.userid ?? 0),
              unitid: Number(row.unitid ?? 0)
            };
          }
        }
      }
      return tiles;
    }

    function renderMap() {
      ctx.clearRect(0, 0, MAP_SIZE, MAP_SIZE);

      for (const tile of worldTiles) {
        if (tile.unitid > 0) {
          ctx.fillStyle = '#ffffff';
        } else if (countryDict[tile.userid]) {
          ctx.fillStyle = countryDict[tile.userid].color;
        } else {
          ctx.fillStyle = '#90ee90';
        }
        ctx.fillRect(tile.x, tile.y, 1, 1);
      }

      // 選択中のマスに枠線を表示
      ctx.strokeStyle = '#ff1744';
      ctx.lineWidth = 0.25;
      ctx.strokeRect(selectedX, selectedY, 1, 1);
    }

    function updateInfoBar(x, y) {
      const tile = worldTiles[y * MAP_SIZE + x];
      if (!tile) return;
      const ownerName = countryDict[tile.userid]
        ? countryDict[tile.userid].name
        : `未占領 / ID:${tile.userid}`;
      infoBar.textContent = `座標 (${x}, ${y}) | 領有: ${ownerName} | ユニット: ${tile.unitid === 0 ? 'なし' : tile.unitid}`;
    }

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor(((e.clientX - rect.left) / rect.width) * MAP_SIZE);
      const y = Math.floor(((e.clientY - rect.top) / rect.height) * MAP_SIZE);
      if (x < 0 || x >= MAP_SIZE || y < 0 || y >= MAP_SIZE) return;

      selectedX = x;
      selectedY = y;
      updateInfoBar(x, y);
      renderMap();
    });

    async function init() {
      const token = localStorage.getItem('sb_access_token');
      if (!token) {
        window.location.href = './index.html';
        return;
      }

      const headers = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${token}`
      };

      const user = await getCurrentUser(headers);
      if (!user) {
        localStorage.removeItem('sb_access_token');
        window.location.href = './index.html';
        return;
      }

      const countries = await loadCountries(headers);
      countryDict = { 0: { name: '未占領地', color: '#90ee90' } };
      let myCountry = null;

      for (const c of countries) {
        countryDict[c.id] = {
          name: c.country_name || `国ID:${c.id}`,
          color: cidToHex(c.Cid || c.cid)
        };
        if (c.user_id === user.email) {
          myCountry = c;
        }
      }

      statusSpan.textContent = myCountry
        ? `自国: ${myCountry.country_name} (ID: ${myCountry.id}),(Money: ${myCountry.money})`
        : `ログイン中: ${user.email}`;

      worldTiles = await fetchAllTiles(headers);
      updateInfoBar(selectedX, selectedY);
      renderMap();
    }

    init().catch((err) => {
      console.error(err);
      statusSpan.textContent = 'エラー: ' + err.message;
    });
  </script>

</body>
</html>
